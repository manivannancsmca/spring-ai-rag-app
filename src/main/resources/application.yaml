server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: hr-policy-rag

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://localhost:5555/vectordb
    username: raguser
    password: ragpassword
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 300000        # 5 minutes (was 10 minutes)
      max-lifetime: 600000        # 10 minutes (was 30 minutes)
      keepalive-time: 300000      # 5 minutes (pings DB to prevent idle TCP drops)

  ai:
    model:
      chat: ollama
      embedding: ollama

    ollama:
      base-url: http://localhost:11434

      chat:
        model: llama3
        options:
          temperature: 0.1
          top-p: 0.9
          num-ctx: 4096
          num-predict: 512

      embedding:
        model: nomic-embed-text

      init:
        pull-model-strategy: never

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.hrpolicy: INFO
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor: DEBUG

app:
  rag:
    top-k: 5
    similarity-threshold: 0.70
    chunk-size: 800
    chunk-overlap: 100